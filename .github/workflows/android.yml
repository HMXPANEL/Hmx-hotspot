name: android

on:
  push:
    branches: [main]
    paths-ignore: ["gateway-native/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (:app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Personal-use signing. Priority:
      #  1) secrets.HMX_RELEASE_STORE_B64 (stable key across builds — recommended)
      #  2) ephemeral keystore generated in CI (uploaded as artifact; back it up
      #     or every build gets a different signature and requires reinstall)
      - name: Configure release keystore
        env:
          HMX_RELEASE_STORE_B64: ${{ secrets.HMX_RELEASE_STORE_B64 }}
        run: |
          if [ -n "$HMX_RELEASE_STORE_B64" ]; then
            echo "$HMX_RELEASE_STORE_B64" | base64 -d > /tmp/hmx-release.jks
            echo "KEY_SOURCE=secret" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret configured; generating EPHEMERAL keystore."
            keytool -genkeypair -v -keystore /tmp/hmx-release.jks -alias hmx               -keyalg RSA -keysize 2048 -validity 10000               -storepass hmx-personal-$(date +%s | tail -c5) -keypass hmx-personal-$(date +%s | tail -c5)               -dname "CN=HMX Personal, OU=Personal, O=HMX, L=Local, S=Local, C=IN"
            echo "KEY_SOURCE=ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Build signed personal release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Record release APK checksum
        run: |
          sha256sum app/build/outputs/apk/release/*.apk
          ls -la app/build/outputs/apk/release/

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmx-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload ephemeral keystore for reuse
        if: ${{ env.KEY_SOURCE == 'ephemeral' }}
        uses: actions/upload-artifact@v4
        with:
          name: hmx-release-keystore-EPHEMERAL-BACKUP-ME
          path: /tmp/hmx-release.jks
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
