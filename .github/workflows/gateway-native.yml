name: gateway-native

on:
  push:
    branches: [main]
    paths: ["gateway-native/**"]
  pull_request:
    paths: ["gateway-native/**"]
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests (host)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: gateway-native/go.sum
      - run: go vet ./...
      - run: go test -count=1 -timeout 180s ./...

  aar:
    name: gomobile AAR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: gateway-native/go.sum
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018" > /dev/null
      - name: Build AAR
        working-directory: gateway-native
        run: |
          go get golang.org/x/mobile@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" bind -target=android/arm64,android/arm -o hmx-gateway.aar .
      - uses: actions/upload-artifact@v4
        with:
          name: hmx-gateway-aar
          path: gateway-native/hmx-gateway.aar
          retention-days: 30
